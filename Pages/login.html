<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InnoBridge Login</title>
  <link rel="stylesheet" href="css/output.css">
  <link rel="stylesheet" href="../css/output.css">
  <script src="../js/script.js" defer></script>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black min-h-screen flex items-center justify-center font-sans">

  <div class="bg-black/40 backdrop-blur-xl p-10 rounded-3xl shadow-2xl w-full max-w-[400px] border border-white/10 text-center">
    
    <h1 class="text-3xl font-light tracking-widest text-white mb-2">INNOBRIDGE</h1>
    <p class="text-white/40 text-sm mb-10 uppercase tracking-tighter">Secure Access</p>

    <div class="relative mb-8 group">
      <span class="absolute left-0 bottom-3 text-white/50 transition-colors group-focus-within:text-blue-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </span>
      <input type="text" placeholder="Username" 
        class="w-full bg-transparent border-none border-b-2 border-white/20 pl-8 pb-2 text-white placeholder:text-white/20 focus:outline-none focus:border-white transition-all">
    </div>

    <div class="relative mb-8 group">
      <span class="absolute left-0 bottom-3 text-white/50 transition-colors group-focus-within:text-blue-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-3.586l6.828-6.828A6 6 0 1121 9z" />
        </svg>
      </span>
      
      <input id="passwordInput" type="password" placeholder="Password" 
        class="w-full bg-transparent border-none border-b-2 border-white/20 pl-8 pb-2 text-white placeholder:text-white/20 focus:outline-none focus:border-white transition-all">
      <button onclick="peekPassword()" class="absolute right-0 bottom-3 text-white/30 hover:text-white transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      </button>
      </button>
    </div>

    <div class="flex justify-between items-center mb-10 text-xs tracking-wide">
      <label class="flex items-center cursor-pointer group/check text-white/40 hover:text-white/70 transition-colors">
        <input type="checkbox" class="w-4 h-4 rounded border-white/20 bg-transparent accent-blue-500 cursor-pointer">
        <span class="ml-2">Remember me</span>
      </label>

      <a href="#" class="text-white/40 hover:text-blue-400 transition-all duration-300 border-b border-transparent hover:border-blue-400 pb-0.5">
        Forgot Password?
      </a>
    </div>

    <button id="loginBtn" onclick="handleLogin()" class="relative w-full bg-white text-black font-bold py-3 rounded-3xl hover:bg-gray-200 transition-all active:scale-95 shadow-lg shadow-white/5 flex items-center justify-center overflow-hidden">
    <span id="btnText">Login</span>
      
    <div id="spinner" class="hidden absolute inset-0 flex items-center justify-center bg-white">
      <div class="w-6 h-6 border-4 border-gray-300 border-t-black rounded-full animate-spin"></div>
    </div>
    </button>
    </div>
  </div>
</body>
</html>
